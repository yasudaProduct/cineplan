name: deploy-st
on:
  push:
    branches: [main]
concurrency:
  group: deploy-st
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: st # GitHub Environment: st の Secrets を使用（docs/14 §5.6）
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test # 緑でなければデプロイしない

      # D1 マイグレーション（ST）。migrations/ はリポジトリルート（api の migrations_dir が参照）
      - name: migrate D1 (st)
        run: pnpm -F @cinema/api exec wrangler d1 migrations apply cinema_hashigo_st --env st --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Workers デプロイ（ST）
      - name: deploy api (st)
        run: pnpm -F @cinema/api exec wrangler deploy --env st
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: deploy ingest (st)
        run: pnpm -F @cinema/ingest exec wrangler deploy --env st
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: deploy web (st)
        run: pnpm -F @cinema/web run deploy:st # CLOUDFLARE_ENV=st でビルド → wrangler deploy（ADR-0013）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
