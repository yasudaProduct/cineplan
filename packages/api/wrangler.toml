name = "cinema-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# --- 既定（local: wrangler dev が使用。ID は local emulation 用のプレースホルダ）---
[[d1_databases]]
binding = "DB"
database_name = "cinema_hashigo"
database_id = "local-cinema-hashigo"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "KV"
id = "local-cinema-kv"

[vars]
APP_ENV = "local"
# 共有 URL（{WEB_BASE_URL}/p/{planId}）の組み立て用（P5-1・docs/04 設計メモ10）
WEB_BASE_URL = "http://localhost:5173"

# --- ST 環境（14 §3.1 命名規約。ID は P4-0 で実値に置換）---
[env.st]
name = "cinema-api-st"

[env.st.vars]
APP_ENV = "st"
WEB_BASE_URL = "https://cinema-web-st.yuta-develop-ct.workers.dev"

[[env.st.d1_databases]]
binding = "DB"
database_name = "cinema_hashigo_st"
database_id = "6af44335-8403-454f-9e4c-36d593e781e8"
migrations_dir = "../../migrations"

[[env.st.kv_namespaces]]
binding = "KV"
id = "d4f5b647d399400889f757e0dc67bfbc"

# --- 本番環境（ID は P5-7 で実値に置換）---
[env.prod]
name = "cinema-api-prod"

[env.prod.vars]
APP_ENV = "prod"
# P5-7 でドメイン確定後に実値へ置換（docs/16 §5.1）
WEB_BASE_URL = "REPLACE_WITH_PROD_WEB_BASE_URL"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "cinema_hashigo_prod"
database_id = "REPLACE_WITH_PROD_D1_ID"
migrations_dir = "../../migrations"

[[env.prod.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_PROD_KV_ID"
