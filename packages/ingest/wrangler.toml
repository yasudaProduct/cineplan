name = "cinema-ingest"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# @cloudflare/puppeteer（Browser Rendering・P4-7）が必要とする Node 互換
compatibility_flags = ["nodejs_compat"]

# rendered 劇場の描画取得（fetch_method=rendered。P4-7・docs/06 §2.0）。
# local でも wrangler dev がローカル Chromium を起動する（docs/14 §8）。
[browser]
binding = "BROWSER"

# Workers Logs（feat/ingest-observability・docs/14 §3.2・docs/16 §6）。
# 構造化ログ（src/log.ts。イベント台帳は README）を保存・検索可能にする。
# サンプリング100%（既定）・保持は Workers Paid で7日。
[observability]
enabled = true

# --- 既定（local）---
[[d1_databases]]
binding = "DB"
database_name = "cinema_hashigo"
database_id = "local-cinema-hashigo"

[[kv_namespaces]]
binding = "KV"
id = "local-cinema-kv"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "cinema-snapshots"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "cinema-ingest-queue"

# 取得マナー（docs/08 §3）: ホスト単位で直列。並列化で実質頻度を上げない。
[[queues.consumers]]
queue = "cinema-ingest-queue"
max_batch_size = 1
max_concurrency = 1
# fetch_failed のみ Queues 標準リトライ対象（docs/06 §7）。3回失敗で consumer 側が ack して打ち切る。
# 指数バックオフ（初回5分後）は msg.retry({delaySeconds}) で consumer 側が明示的に計算する（queue()）。
max_retries = 3

[vars]
APP_ENV = "local"

# Cron は本番のみ有効（docs/14 §3.2）。local/st では定義しない（先方サイトを毎日叩かない）。

# --- ST 環境 ---
[env.st]
name = "cinema-ingest-st"

[env.st.vars]
APP_ENV = "st"
# 抽出プロバイダを明示（ADR-0011: 本番/ST は Gemini 無料枠）。GEMINI_API_KEY は secret。
LLM_PROVIDER = "gemini"
# Flash-Lite 系の最新安定版（ADR-0018）。最上位 Flash（gemini-flash-latest）は無料枠の
# 容量逼迫（503/応答保留→120sタイムアウト）で全取込が失敗するため切替。戻す場合はこの行を削除。
GEMINI_MODEL = "gemini-flash-lite-latest"

# Workers Logs（環境ごとに明示。既定セクションからは継承されない）
[env.st.observability]
enabled = true

[[env.st.d1_databases]]
binding = "DB"
database_name = "cinema_hashigo_st"
database_id = "6af44335-8403-454f-9e4c-36d593e781e8"

[[env.st.kv_namespaces]]
binding = "KV"
id = "d4f5b647d399400889f757e0dc67bfbc"

[[env.st.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "cinema-snapshots-st"

[env.st.browser]
binding = "BROWSER"

[[env.st.queues.producers]]
binding = "INGEST_QUEUE"
queue = "cinema-ingest-queue-st"

[[env.st.queues.consumers]]
queue = "cinema-ingest-queue-st"
max_batch_size = 1
max_concurrency = 1
# fetch_failed のみ Queues 標準リトライ対象（docs/06 §7）。3回失敗で consumer 側が ack して打ち切る。
# 指数バックオフ（初回5分後）は msg.retry({delaySeconds}) で consumer 側が明示的に計算する（queue()）。
max_retries = 3

# --- 本番環境（Cron 有効。21:00 UTC = 06:00 JST。N-02 の鮮度要件）---
[env.prod]
name = "cinema-ingest-prod"

[env.prod.vars]
APP_ENV = "prod"
# 抽出プロバイダを明示（ADR-0011: 本番/ST は Gemini 無料枠）。GEMINI_API_KEY は secret。
LLM_PROVIDER = "gemini"
# Flash-Lite 系の最新安定版（ADR-0018。ST と同一に保つ）
GEMINI_MODEL = "gemini-flash-lite-latest"

# Workers Logs（環境ごとに明示。既定セクションからは継承されない）
[env.prod.observability]
enabled = true

[[env.prod.d1_databases]]
binding = "DB"
database_name = "cinema_hashigo_prod"
database_id = "REPLACE_WITH_PROD_D1_ID"

[[env.prod.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_PROD_KV_ID"

[[env.prod.r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "cinema-snapshots-prod"

[env.prod.browser]
binding = "BROWSER"

[[env.prod.queues.producers]]
binding = "INGEST_QUEUE"
queue = "cinema-ingest-queue-prod"

[[env.prod.queues.consumers]]
queue = "cinema-ingest-queue-prod"
max_batch_size = 1
max_concurrency = 1
# fetch_failed のみ Queues 標準リトライ対象（docs/06 §7）。3回失敗で consumer 側が ack して打ち切る。
# 指数バックオフ（初回5分後）は msg.retry({delaySeconds}) で consumer 側が明示的に計算する（queue()）。
max_retries = 3

[env.prod.triggers]
# 毎日 21:00 UTC = 06:00 JST: 取込ディスパッチ / 月曜 18:00 UTC = 火曜 03:00 JST: TravelMatrix 週次（ADR-0014）
crons = ["0 21 * * *", "0 18 * * 1"]
